# Overlay values — layer on top of helm/easytrade/values.yaml to enable OpenTelemetry
# auto-instrumentation injection for each service. Apply with:
#
#   helm upgrade easytrade helm/easytrade \
#     -f helm/easytrade/values.yaml \
#     -f helm/easytrade/values-otel-instrumentation.yaml \
#     --namespace easytrade
#
# See docs/dynatrace-otel-auto-instrumentation.md for the full setup this depends on
# (OpenTelemetry Operator + Instrumentation CRs must already be installed in the
# "dynatrace" namespace before these annotations take effect).

accountservice:
  podAnnotations:
    instrumentation.opentelemetry.io/inject-java: "dynatrace/java-instrumentation"

contentcreator:
  podAnnotations:
    instrumentation.opentelemetry.io/inject-java: "dynatrace/java-instrumentation"

